services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    ports:
      - "6333:6333"   # REST API — what qdrant-client talks to by default
      - "6334:6334"   # gRPC API — only needed if your code uses prefer_grpc=True
    volumes:
      - qdrant_storage:/qdrant/storage   # persists data across container restarts
    restart: unless-stopped

volumes:
  qdrant_storage:
